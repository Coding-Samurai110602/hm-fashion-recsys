[mypy]
ignore_missing_imports = True
no_implicit_reexport = True
no_strict_optional = True
warn_unused_ignores = True

# Training/pipeline code — not in CI scope; suppress errors from import-following
[mypy-src.candidates.*]
ignore_errors = True

[mypy-src.features.*]
ignore_errors = True

[mypy-src.model.*]
ignore_errors = True

[mypy-src.evaluation.*]
ignore_errors = True

[mypy-src.evaluate]
ignore_errors = True

[mypy-src.explain.*]
ignore_errors = True

[mypy-src.candidates]
ignore_errors = True
