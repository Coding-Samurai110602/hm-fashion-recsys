name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: lint-${{ hashFiles('requirements-dev.txt') }}

      - name: Install dev tooling (pinned)
        run: pip install -r requirements-dev.txt

      - name: ruff lint
        run: ruff check src/api/ tests/api/ src/serving/

      - name: ruff format check
        run: ruff format --check src/api/ tests/api/ src/serving/

      - name: mypy (src/api src/serving — config in mypy.ini)
        run: mypy src/api src/serving

  test:
    name: Unit & API tests (no Kaggle data)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: api-${{ hashFiles('requirements-api.txt', 'requirements-dev.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements-api.txt
          pip install -r requirements-dev.txt

      - name: Build synthetic bundle
        run: PYTHONPATH=. python scripts/make_synthetic_bundle.py

      - name: Export OpenAPI snapshot
        run: PYTHONPATH=. python scripts/export_openapi.py

      - name: Run tests (excluding real bundle, slow, and Kaggle data tests)
        env:
          BUNDLE_PATH: artifacts/bundle_synthetic
          HM_DATA_DIR: /tmp/no_data
        run: |
          PYTHONPATH=. python -m pytest \
            -q \
            -m "not integration_real and not slow and not requires_data" \
            --tb=short

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Check generated types are up-to-date
        run: npm run check-types-fresh

  docker-build:
    name: Docker build + smoke test (API)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t hm-recsys-api:ci .

      - name: Start container with synthetic bundle
        run: |
          docker run -d \
            --name hm-api \
            -p 8000:8000 \
            -e BUNDLE_PATH=/app/artifacts/bundle_synthetic \
            -e LOG_LEVEL=INFO \
            hm-recsys-api:ci

      - name: Wait, smoke-test, and report image size
        run: bash scripts/ci_smoke_test.sh

      - name: Stop container
        if: always()
        run: docker rm -f hm-api || true

  e2e:
    name: E2E tests (compose stack, synthetic bundle)
    runs-on: ubuntu-latest
    needs: [frontend, docker-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build API image
        run: docker build -t hm-recsys-api:latest .

      - name: Build Web image
        run: docker build -t hm-recsys-web:latest frontend/

      - name: Start compose stack (synthetic bundle)
        run: |
          BUNDLE_DIR=./artifacts/bundle_synthetic \
          SQLITE_DB_PATH=/tmp/profiles_e2e.db \
            docker compose up -d

      - name: Wait for web container to be healthy
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "Web is ready after $((i * 5))s"
              break
            fi
            echo "Waiting for http://localhost:8080/ ... ($i/40)"
            sleep 5
          done
          curl -sf http://localhost:8080/ > /dev/null || { echo "Web never became ready"; exit 1; }

      - name: Run Playwright E2E tests against containerised stack
        working-directory: frontend
        env:
          CI: "true"
          BASE_URL: "http://localhost:8080"
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots-${{ github.run_id }}
          path: docs/screenshots/
          retention-days: 7

      - name: Stop and remove compose stack (including volumes)
        if: always()
        run: docker compose down -v
