[pytest]
markers =
    unit: pure unit tests, no server or bundle required
    api: API endpoint tests against the synthetic bundle
    integration_real: tests against the real bundle (skipped when bundle absent)
    slow: tests that take > 30s
    requires_data: tests that need the Kaggle processed data (auto-skipped in CI when data absent)
    not_requires_data: overrides a module-level requires_data pytestmark; test is purely synthetic
testpaths = tests
